<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Animation: a Solana program requests a ruling; AI models off chain read the prompt and context stored on chain, vote and attach proofs; the signed ruling is recorded on chain; the program verifies it and acts.">
<style>
text{font-family:Inter,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
.m{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.lab{font-size:15px;letter-spacing:2px;fill:#6B7785}
.t{font-size:22px;font-weight:700}
.s{font-size:16px;fill:#9AA7B4}
.k{fill:#5FE0C8}
.box{fill:#0E141B;stroke:#1E2A36;stroke-width:1.5}
.hot{fill:none;stroke:#5FE0C8;stroke-width:2.5;opacity:0}
.band{fill:#0B0E12;stroke:#1E2A36;stroke-dasharray:6 6}
.cap{font-size:22px;font-weight:600;opacity:0;text-anchor:middle}
@keyframes c1{0%,1%{opacity:0}3%,19%{opacity:1}21%,100%{opacity:0}}
@keyframes c2{0%,21%{opacity:0}23%,41%{opacity:1}43%,100%{opacity:0}}
@keyframes c3{0%,43%{opacity:0}45%,59%{opacity:1}61%,100%{opacity:0}}
@keyframes c4{0%,61%{opacity:0}63%,93%{opacity:1}96%,100%{opacity:0}}
#c1{animation:c1 12s infinite}#c2{animation:c2 12s infinite}#c3{animation:c3 12s infinite}#c4{animation:c4 12s infinite}
@keyframes down{0%,6%{transform:translate(0,0);opacity:0}8%{opacity:1}20%{transform:translate(0,150px);opacity:1}22%,100%{transform:translate(0,150px);opacity:0}}
#p1{animation:down 12s infinite}
@keyframes up{0%,54%{transform:translate(0,0);opacity:0}56%{opacity:1}66%{transform:translate(390px,-150px);opacity:1}68%,100%{transform:translate(390px,-150px);opacity:0}}
#p2{animation:up 12s infinite}
@keyframes read{0%,20%{opacity:0}23%,40%{opacity:.9}44%,100%{opacity:0}}
#read{animation:read 12s infinite}
@keyframes lit{0%{opacity:0}100%{opacity:1}}
.j .hot{animation:jh 12s infinite}
.j .vote{opacity:0;animation:jv 12s infinite}
.j .think{opacity:0;animation:jt 12s infinite}
.j .proof{opacity:0;animation:jp 12s infinite}
@keyframes jh{0%,22%{opacity:0}26%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes jt{0%,22%{opacity:0}25%,33%{opacity:1}36%,100%{opacity:0}}
@keyframes jv{0%,35%{opacity:0}38%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes jp{0%,45%{opacity:0}48%,92%{opacity:1}96%,100%{opacity:0}}
#j2 *{animation-delay:.35s}#j3 *{animation-delay:.7s}#j4 *{animation-delay:1.05s}#j5 *{animation-delay:1.4s}
@keyframes rec{0%,66%{opacity:0}69%,93%{opacity:1}96%,100%{opacity:0}}
.rec{opacity:0;animation:rec 12s infinite}
@keyframes empty{0%,66%{opacity:1}69%,93%{opacity:0}96%,100%{opacity:1}}
.empty{animation:empty 12s infinite}
@keyframes act{0%,74%{opacity:0}77%,93%{opacity:1}96%,100%{opacity:0}}
.act{opacity:0;animation:act 12s infinite}
@keyframes wait{0%,74%{opacity:1}77%,93%{opacity:0}96%,100%{opacity:1}}
.wait{animation:wait 12s infinite}
@keyframes hr{0%,66%{opacity:0}69%,93%{opacity:1}96%,100%{opacity:0}}
#rhot{animation:hr 12s infinite}
@keyframes hp{0%,74%{opacity:0}77%,93%{opacity:1}96%,100%{opacity:0}}
#phot{animation:hp 12s infinite}
@keyframes hq{0%,2%{opacity:0}5%,20%{opacity:1}23%,100%{opacity:0}}
#qhot{animation:hq 12s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.cap#c4,.rec,.act,.j .vote,.j .proof,.j .hot,#rhot{opacity:1}.empty,.wait{opacity:0}}
</style>
<rect width="1200" height="700" fill="#0B0E12"/>
<rect class="band" x="20" y="20" width="1160" height="290" rx="16"/>
<text class="m lab" x="44" y="54">ON CHAIN · SOLANA</text>
<rect class="band" x="20" y="340" width="1160" height="270" rx="16"/>
<text class="m lab" x="44" y="374">OFF CHAIN · AI MODELS</text>

<g>
<rect class="box" x="44" y="76" width="340" height="210" rx="12"/>
<text class="t" x="68" y="114">Inference program</text>
<text class="m s" x="68" y="150">prompt  withdrawals</text>
<text class="m s" x="68" y="178">context DAO constitution</text>
<text class="m s" x="68" y="206">context DAO forum thread</text>
<text class="m s" x="68" y="248"><tspan class="k">hash</tspan> 4b1e07c2…  pinned</text>
</g>
<rect id="read" class="hot" x="44" y="76" width="340" height="210" rx="12" style="stroke-dasharray:8 6"/>

<g>
<rect class="box" x="430" y="76" width="340" height="210" rx="12"/>
<rect id="qhot" class="hot" x="430" y="76" width="340" height="210" rx="12"/>
<rect id="phot" class="hot" x="430" y="76" width="340" height="210" rx="12"/>
<text class="t" x="454" y="114">Calling program</text>
<text class="m s" x="454" y="150">withdraw(</text>
<text class="m s" x="454" y="178">  $250,000, wallet A)</text>
<text class="m s wait" x="454" y="248">requestRuling(…) <tspan class="k">waiting</tspan></text>
<text class="m s act" x="454" y="248"><tspan class="k">verifyRuling: allow</tspan>  sent</text>
</g>

<g>
<rect class="box" x="816" y="76" width="340" height="210" rx="12"/>
<rect id="rhot" class="hot" x="816" y="76" width="340" height="210" rx="12"/>
<text class="t" x="840" y="114">Ruling record</text>
<text class="m s empty" x="840" y="178">no ruling yet</text>
<text class="m s rec" x="840" y="150"><tspan class="k">ALLOW</tspan>  5 of 5 agree</text>
<text class="m s rec" x="840" y="178">5 signatures checked</text>
<text class="m s rec" x="840" y="206">proofs: verified</text>
<text class="m s rec" x="840" y="248">prompt + context hashes</text>
</g>

<g id="j1" class="j"><rect class="box" x="44" y="400" width="204" height="170" rx="12"/><rect class="hot" x="44" y="400" width="204" height="170" rx="12"/>
<text class="t" x="66" y="438">GPT</text><text class="m s think" x="66" y="478">reading…</text><text class="m s k vote" x="66" y="478">[x] allow</text><text class="m s proof" x="66" y="540">signed + ZK proof</text></g>
<g id="j2" class="j"><rect class="box" x="270" y="400" width="204" height="170" rx="12"/><rect class="hot" x="270" y="400" width="204" height="170" rx="12"/>
<text class="t" x="292" y="438">Claude</text><text class="m s think" x="292" y="478">reading…</text><text class="m s k vote" x="292" y="478">[x] allow</text><text class="m s proof" x="292" y="540">signed + ZK proof</text></g>
<g id="j3" class="j"><rect class="box" x="496" y="400" width="204" height="170" rx="12"/><rect class="hot" x="496" y="400" width="204" height="170" rx="12"/>
<text class="t" x="518" y="438">Gemini</text><text class="m s think" x="518" y="478">reading…</text><text class="m s k vote" x="518" y="478">[x] allow</text><text class="m s proof" x="518" y="540">signed + ZK proof</text></g>
<g id="j4" class="j"><rect class="box" x="722" y="400" width="204" height="170" rx="12"/><rect class="hot" x="722" y="400" width="204" height="170" rx="12"/>
<text class="t" x="744" y="438">Qwen</text><text class="m s think" x="744" y="478">reading…</text><text class="m s k vote" x="744" y="478">[x] allow</text><text class="m s proof" x="744" y="540">signed + ZK proof</text></g>
<g id="j5" class="j"><rect class="box" x="948" y="400" width="204" height="170" rx="12"/><rect class="hot" x="948" y="400" width="204" height="170" rx="12"/>
<text class="t" x="970" y="438">Llama</text><text class="m s think" x="970" y="478">reading…</text><text class="m s k vote" x="970" y="478">[x] allow</text><text class="m s proof" x="970" y="540">signed + ZK proof</text></g>

<circle id="p1" cx="600" cy="268" r="11" fill="#5FE0C8"/>
<circle id="p2" cx="600" cy="418" r="11" fill="#5FE0C8"/>

<text id="c1" class="cap" x="600" y="660">1. A program asks for a ruling on one exact action.</text>
<text id="c2" class="cap" x="600" y="660">2. Models from different labs read the prompt and context, and vote.</text>
<text id="c3" class="cap" x="600" y="660">3. Each vote is signed, with a proof of which model ran.</text>
<text id="c4" class="cap" x="600" y="660">4. The ruling is recorded on chain. The program checks it, then acts.</text>
</svg>
