# Certify every push to main against the standards this repo claims to meet.
# A certificate is a code review of one commit against a published standard,
# not a legal or safety certification. Planned API.
name: ASC certify
on:
  push:
    branches: [main]
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: verafy/asc-certify@v0     # planned
        with:
          standards: EAO@1.0, ETC@1.0   # Ethical Agent Operations, Ethical Treasury Conduct
          fail-on: fail                 # or: needs_evidence
          api-key: ${{ secrets.ASC_API_KEY }}
      # Writes asc-report.md to the job summary and the ASCII badge to the PR.
